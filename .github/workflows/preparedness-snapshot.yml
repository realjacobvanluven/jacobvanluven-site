name: Preparedness snapshot

# Saves a fallback copy of the BC Preparedness Board data. The page reads live data first and only uses
# this copy when a source fails. GitHub runs scheduled jobs on a best-effort basis, so they can be late.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: preparedness-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build snapshot
        run: node scripts/build-preparedness-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/preparedness-snapshot.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update preparedness snapshot"
            git push
          fi
