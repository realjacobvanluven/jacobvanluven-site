<!doctype html>
<!--
  Skyline look development: the realistic blue-hour scene from src/hero/, as a still.
  Not part of the site. Serve the repo root locally and open
  /scripts/skyline-lookdev.html?preset=desktop   (or preset=phone)
  Options: &terrain=procedural (before/after), &bench=1 (per-effect timings), &live=1 (run the real
  runtime loop for a few seconds and report the adaptive tier).
  Sets window.__result = { png, stats, timings, bench, log } for the capture script.
-->
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script>
  window.__log = [];
  for (const k of ['error', 'warn']) {
    const orig = console[k].bind(console);
    console[k] = (...a) => { window.__log.push(k + ': ' + a.map(String).join(' ').slice(0, 1500)); orig(...a); };
  }
</script>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createSkylineScene } from '/src/hero/scene.js';
import { startHero } from '/src/hero/runtime.js';

const params = new URLSearchParams(location.search);
const layout = params.get('preset') ?? 'desktop';
// &w=…&h=…&dpr=… override the size (used to render the homepage posters).
const [width, height] = params.get('w') ? [+params.get('w'), +params.get('h')] : layout === 'phone' ? [375, 812] : [1600, 900];
const dprOverride = params.get('dpr') ? +params.get('dpr') : null;
const canvas = document.getElementById('c');
canvas.style.width = width + 'px';
canvas.style.height = height + 'px';

try {
  if (params.get('live')) {
    const tiers = [];
    const { hero, stop } = await startHero({ canvas, layout, dataUrl: '/public/data/skyline.json?v=' + Date.now(), onTierChange: (t, fps) => tiers.push({ tier: t, fps: +fps.toFixed(1) }) });
    // &slow=ms simulates a slow device (busy-wait per frame) to exercise the tier drop.
    const slow = +(params.get('slow') ?? 0);
    if (slow) { const r = hero.render; hero.render = (t) => { const e = performance.now() + slow; while (performance.now() < e); r(t); }; }
    await new Promise((r) => setTimeout(r, 6000));
    stop();
    window.__result = { png: canvas.toDataURL('image/png'), tiers, stats: hero.stats, log: window.__log };
  } else {
    const s = await createSkylineScene({
      canvas, width, height, layout, dataUrl: '/public/data/skyline.json?v=' + Date.now(),
      terrain: params.get('terrain') ?? 'dem',
      // Stills: desktop at 1600×900 exactly; phone at its starting tier (1.5× density).
      maxPixelRatio: dprOverride ?? (layout === 'phone' ? 1.5 : 1),
      devicePixelRatio: dprOverride ?? (layout === 'phone' ? 3 : 1), // simulate a phone screen in the headless capture
      preserveDrawingBuffer: true,
      // &height=metres&pitch=degrees (offset): camera height experiments.
      cameraHeight: params.get('height') ? +params.get('height') : undefined,
      pitchOffset: params.get('pitchOffset') ? +params.get('pitchOffset') : 0,
      tier: params.get('tier') ?? (layout === 'phone' ? 'medium' : 'high'),
    });
    // &highlight=signatures paints the hand-built towers flat orange (visibility check).
    if (params.get('highlight') === 'signatures') {
      const THREE = await import('three');
      s.scene.traverse((o) => { if (o.userData.signatures) o.material = new THREE.MeshBasicMaterial({ color: 0xff6a00 }); });
    }
    if (params.get('bearing')) s.look({ bearing: +params.get('bearing'), pitch: +(params.get('pitch') ?? 0), fov: params.get('fov') ? +params.get('fov') : undefined }); // comparison / close-up views
    s.render(+(params.get('time') ?? 3)); // &time=seconds: animation time for the still
    const png = s.renderer.domElement.toDataURL('image/png');
    let bench = null;
    if (params.get('bench')) {
      const gl = s.renderer.getContext();
      const px = new Uint8Array(4);
      const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      const time = (fn, n = 30) => {
        for (let i = 0; i < 4; i++) fn();
        sync();
        const t = performance.now();
        for (let i = 0; i < n; i++) { fn(); sync(); }
        return +((performance.now() - t) / n).toFixed(2);
      };
      const { passes, water } = s;
      const reflect = water.onBeforeRender;
      bench = {};
      bench.full = time(() => s.render());
      passes.bloomPass.enabled = false; bench.noBloom = time(() => s.render()); passes.bloomPass.enabled = true;
      passes.grainPass.enabled = false; bench.noGrain = time(() => s.render()); passes.grainPass.enabled = true;
      water.onBeforeRender = () => {}; bench.noReflection = time(() => s.render()); water.onBeforeRender = reflect;
      s.points.visible = false; bench.noLightSprites = time(() => s.render()); s.points.visible = true;
    }
    window.__result = { png, stats: s.stats, timings: s.timings, bench, log: window.__log };
  }
} catch (e) {
  window.__result = { png: '', error: String((e && e.stack) || e), log: window.__log };
}
</script>
</body>
</html>
